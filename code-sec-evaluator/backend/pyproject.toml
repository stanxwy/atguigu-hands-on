[project]
name = "code-sec-evaluator-backend"
version = "0.1.0"
description = "自动化安全评估系统后端（FastAPI + SQLAlchemy 2.0 + Pydantic v2）"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn[standard]>=0.32,<1",
    "sqlalchemy>=2.0,<3",
    "alembic>=1.14,<2",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "PyJWT>=2.10,<3",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0,<5",
    "python-multipart>=0.0.20,<1",
    "PyMySQL>=1.1,<2",
    # 默认数据库为 SQLite（异步），运行时需 aiosqlite 驱动（否则 uv sync 后默认启动缺驱动）
    "aiosqlite>=0.20,<1",
    "docker>=7.1,<8",
    "psutil>=6.1,<7",
    "Markdown>=3.7,<4",
    "PyYAML>=6.0,<7",
    "python-dotenv>=1.0,<2",
    "aiofiles>=24.1,<25",
    "nh3>=0.2,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24,<1",
    "httpx>=0.27,<1",
    "pytest-cov>=5.0,<7",
    "pytest-xdist>=3.6,<4",
    "pytest-mock>=3.14,<4",
    "pytest-timeout>=2.3,<3",
    "Faker>=30.0,<37",
    "aiosqlite>=0.20,<1",
    "black>=24.0,<26",
    "isort>=5.13,<6",
    "ruff>=0.8,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

# ---------------------------------------------------------------------------
# 代码风格工具配置（对齐《编码规范》§2.1）
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 88

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "N"]
ignore = ["E501"] # 行宽交给 Black 处理

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
