# Alembic configuration for the KBMS relational data layer.
# The database URL is NOT hard-coded here; it is injected at runtime from
# app settings (Settings.DATABASE_URL) inside alembic/env.py, so the same file
# works for PostgreSQL and SQLite (dev/test).

[alembic]
# Path to the migration script directory (contains env.py and versions/).
script_location = alembic

# Make the backend project root importable so `app.*` resolves when running
# `alembic` from this directory (namespace package, no __init__.py).
prepend_sys_path = .
path_separator = os

# Overridden by env.py via Settings.DATABASE_URL.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
