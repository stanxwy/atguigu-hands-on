[project]
name = "knowledge-base"
version = "0.1.0"
description = "RAG knowledge base system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13.2",
    "bcrypt>=4.2.0",
    "cachetools>=5.5.0",
    "colorlog>=6.10.1",
    "dashscope>=1.26.4",
    "fastapi>=0.139.0",
    "flagembedding>=1.3.5",
    "grandalf>=0.8",
    "langchain>=1.3.13",
    "langchain-openai>=1.3.5",
    "langchain-text-splitters>=1.1.2",
    "langgraph>=1.2.9",
    "loguru>=0.7.3",
    "minio>=7.2.20",
    "modelscope>=1.38.1",
    "numpy>=2.4.6",
    "openai-agents>=0.18.3",
    "psycopg[binary]>=3.2",
    "pyjwt>=2.9.0",
    "pymilvus[model]>=3.0.0",
    "pymongo>=4.17.0",
    "python-dotenv>=1.2.2",
    "python-multipart>=0.0.9",
    "rich>=15.0.0",
    "sqlalchemy>=2.0.30",
    "transformers>=4.45.0,<5.0.0",
    "uvicorn[standard]>=0.51.0",
]

[dependency-groups]
dev = [
    "black>=24.8",
    "coverage>=7.6",
    "httpx>=0.27",
    "isort>=5.13",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.black]
line-length = 120
target-version = ["py311"]

[tool.isort]
profile = "black"
line_length = 120

[tool.ruff]
line-length = 120
target-version = "py311"
